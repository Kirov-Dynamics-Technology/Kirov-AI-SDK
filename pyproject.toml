[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirov-ai-sdk"
version = "1.0.0"
description = "Shared internal SDK for LLM orchestration, telemetry, and prompt management across the Kirov Dynamics ecosystem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kirov_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
